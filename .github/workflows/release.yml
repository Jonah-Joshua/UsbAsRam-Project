name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-aarch64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/usbasram${{ matrix.ext }}" \
             "dist/usbasram-${{ matrix.label }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: usbasram-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum usbasram-* > SHA256SUMS.txt
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: usbasram ${{ github.ref_name }}
          body: |
            ## usbasram ${{ github.ref_name }}

            A crash-safe, tiered RAM + USB storage engine written in Rust.

            Hot pages live in a sharded RAM cache; cold pages live in a
            CRC32C-protected, LZ4-compressed append-only log on the backing
            device. The NBD server exposes the store as a standard block device.

            This release includes standalone binaries for Linux, Windows, and
            macOS (Apple Silicon), plus SHA-256 checksums.

            **Important:** USB storage cannot be faster than DDR3. This project
            keeps the hot set in RAM and makes the cold tier durable and
            compressed; the benchmark reports hot and cold phases separately.

            See the README for usage, the architecture document for the format
            and recovery rules, and SECURITY.md before exposing the NBD listener
            to a network.
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
